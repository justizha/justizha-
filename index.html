<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>justizha.</title>
    <meta
      name="description"
      content="Izha's blog and what I'm listening to on Last.fm."
    />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://lastfm-img.freetls.fastly.net" />
    <script>
      if (location.pathname.replace(/\/$/, '') === '/music') {
        window.__lastfm = fetch(
          '/api/lastfm-all?user=%VITE_USER_NAME%'
        ).then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        });
      }
    </script>
  </head>
  <body class="font-cascadia h-fit">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
